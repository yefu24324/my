# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
     # 克隆代码
    - name: Checkout
      uses: actions/checkout@v4

    # 设置Node环境
    - uses: pnpm/setup@v1
      with:
        version: 12.4.1
        runtime: node@26.9.0
        cache: true

    # 安装依赖
    - name: Install dependencies
      run: pnpm i

    # 编译
    - name: Build
      run: |
        pnpm build
        SHORT_SHA=$(git rev-parse --short HEAD)
        DEPLOY_DIR=/root/workspace/github-ci-deploy/blog
        echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
        echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"
        tar -czf "dist-$SHORT_SHA.tgz" -C dist .
      
    # 上传产物
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist-${{ env.SHORT_SHA }}.tgz

    # 部署
    - name: Deploy
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: dist-${{ env.SHORT_SHA }}.tgz
        target: "${{ env.DEPLOY_DIR }}"

    # 解压产物到 current（临时目录解压 + 秒级切换），压缩包归档进 history
    - name: Activate
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          set -e
          cd "${{ env.DEPLOY_DIR }}"

          bash deploy.sh "dist-${{ env.SHORT_SHA }}.tgz"